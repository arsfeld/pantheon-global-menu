# Builds the Pantheon port (pantheon/) as a .deb for elementary OS 8 and
# publishes it as a signed apt repository on GitHub Pages:
# https://arsfeld.github.io/pantheon-global-menu/
#
# The signing key's secret half is the APT_SIGNING_KEY repository secret; its
# public half is pantheon/apt/pantheon-global-menu.asc, which build-repo.sh
# signs against, so the two must be rotated together.
name: Pantheon apt repository

on:
  push:
    branches: [main]
    paths:
      - pantheon/**
      - global-menu@unmade.space/shortcuts/**
      - .github/workflows/pantheon-apt.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pantheon-apt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # elementary OS 8 (circe). Not :stable, which will move to the next
    # release and its different gala and mutter.
    container: ghcr.io/elementary/docker:circe-stable
    steps:
      - uses: actions/checkout@v7

      - name: Build the package
        run: sh pantheon/debian/build.sh debs

      - uses: actions/upload-artifact@v7
        with:
          name: debs
          path: debs/*.deb

      - name: Build the apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          apt-get install -y --no-install-recommends apt-utils
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          sh pantheon/apt/build-repo.sh debs site
          rm -rf "$GNUPGHOME"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
